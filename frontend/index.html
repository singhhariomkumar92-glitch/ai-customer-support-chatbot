<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Support Chatbot</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-content">
                <h1>Customer Support Bot</h1>
                <p class="status" id="status">Ready to help</p>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    <p>Hello! 👋 I'm your customer support assistant. How can I help you today?</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-container">
            <div class="input-group">
                <textarea 
                    id="userInput" 
                    class="chat-input" 
                    placeholder="Type your message here..." 
                    rows="1"
                    maxlength="5000"
                ></textarea>
                <button id="sendBtn" class="send-button" title="Send message">
                    <span class="send-icon">➤</span>
                </button>
            </div>
            <div class="char-count">
                <span id="charCount">0</span>/5000
            </div>
        </div>

        <!-- Loading Indicator -->
        <div class="loading-indicator" id="loadingIndicator" style="display: none;">
            <div class="spinner"></div>
            <span>Bot is typing...</span>
        </div>
    </div>

    <script src="static/js/script.js"></script>
</body>
</html>
